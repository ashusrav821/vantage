<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vantage — Daily Leadership Sessions</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f2937">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1f232c; --line:#2a2f3a;
    --text:#eef0f3; --muted:#9aa3b2; --accent:#f4a83c; --accent2:#e8944a;
    --good:#4caf7d; --warn:#e0616b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  .app{max-width:520px;margin:0 auto;padding:20px 16px 40px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand-icon{width:40px;height:40px;border-radius:11px;flex:0 0 40px;display:block;}
  .brand-text{display:flex;flex-direction:column;}
  .tagline{font-size:10.5px;color:var(--accent);font-weight:600;margin-top:1px;letter-spacing:.1px;}
  .streak{display:flex;align-items:center;gap:6px;background:var(--card2);
    border:1px solid var(--line);padding:6px 10px;border-radius:20px;font-size:13px;color:var(--accent);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;}
  .module-badge{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--accent);background:rgba(244,168,60,.12);border:1px solid rgba(244,168,60,.3);
    padding:3px 9px;border-radius:20px;margin-bottom:10px;}
  .day-label{font-size:12px;color:var(--muted);margin-bottom:2px;}
  .topic-title{font-size:21px;font-weight:700;line-height:1.3;margin:2px 0 10px;}
  .situation{font-size:14.5px;color:#c7cbd4;line-height:1.5;margin-bottom:4px;}
  .situation b{color:var(--text);}
  .btn{display:block;width:100%;text-align:center;padding:14px;border-radius:12px;border:none;
    font-size:16px;font-weight:600;cursor:pointer;margin-top:12px;}
  .btn-primary{background:var(--accent);color:#1a1200;}
  .btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--line);}
  .btn:active{transform:scale(.98);}
  .done-check{text-align:center;color:var(--good);font-size:14px;font-weight:600;margin-top:10px;}
  .progress-wrap{margin-top:16px;}
  .progress-bar-bg{height:8px;background:var(--card2);border-radius:8px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:8px;transition:width .3s;}
  .progress-text{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;}
  .review-card{border-left:3px solid var(--accent);}
  .review-card .rlabel{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .hidden{display:none !important;}
  .phase-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .phase-name{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);}
  .timer{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;}
  .timer.low{color:var(--warn);}
  .phase-body{font-size:15px;line-height:1.55;color:#dfe2e8;margin:12px 0;white-space:pre-line;}
  textarea{width:100%;min-height:80px;background:var(--card2);border:1px solid var(--line);
    border-radius:10px;color:var(--text);padding:12px;font-size:14.5px;font-family:inherit;resize:vertical;}
  .row{display:flex;gap:10px;}
  .row .btn{margin-top:12px;}
  .steps{display:flex;gap:5px;margin-bottom:14px;}
  .step{flex:1;height:4px;border-radius:3px;background:var(--card2);}
  .step.active{background:var(--accent);}
  .step.past{background:var(--good);}
  .list-topics{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .list-topics.open{max-height:1400px;margin-top:10px;}
  .topic-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .topic-row:last-child{border-bottom:none;}
  .tick{width:18px;height:18px;border-radius:50%;flex:0 0 18px;border:1.5px solid var(--line);}
  .tick.on{background:var(--good);border-color:var(--good);}
  .toggle-list{text-align:center;font-size:13px;color:var(--muted);margin-top:12px;cursor:pointer;}
  .takeaways{font-size:13px;color:var(--muted);}
  .takeaways .tk{padding:8px 0;border-bottom:1px solid var(--line);color:#c7cbd4;}
  .nudge-banner{background:rgba(224,97,107,.12);border:1px solid rgba(224,97,107,.35);
    color:#f2a7ab;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px;}
  .footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;line-height:1.6;}
  .mic-row{display:flex;justify-content:flex-end;margin-top:6px;}
  .mic-btn{display:inline-flex;align-items:center;gap:6px;background:var(--card2);
    border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:600;
    padding:7px 12px;border-radius:20px;cursor:pointer;}
  .mic-btn.recording{background:rgba(224,97,107,.15);border-color:var(--warn);color:var(--warn);}
  .data-row{display:flex;gap:10px;}
  .data-row .btn{margin-top:0;flex:1;font-size:13.5px;padding:11px;}
  .resume-note{font-size:12px;color:var(--accent);font-weight:600;margin-top:10px;text-align:center;}
</style>
</head>

{m:"Communication Foundations",t:"Leadership Writing: Executive Summary Emails",s:"You need a senior leader to approve a budget, unblock a decision, or back an opportunity \\u2014 if the first few lines are unclear, it turns into a chain of questions.",l:"Write an executive summary that gets senior leaders to understand the issue quickly, see what matters, and respond with the decision or support you need.",tpl:"Subject: [Decision/ask in one line]\n\nHi [Name], we need [decision] by [date] because [risk/impact if delayed].\n\nSituation: [1-2 sentence context].\nRecommendation: [what you want them to approve/do].\nWhy: [top 2 reasons].\nAsk: [specific action + deadline]."},

{m:"Communication Foundations",t:"Turning Metrics into Meaning",s:"You have data, dashboards and KPIs, but leaders don't need another data dump \\u2014 they need to know what the numbers mean and what action is required.",l:"Turn metrics into a clear business story that helps leaders understand what matters and decide what to do next.",tpl:"[Metric] is at [number], which means [what's actually happening].\nCompared to [benchmark/last period], this is [better/worse] because [reason].\nWhat this means for the business: [impact].\nWhat I recommend: [action]."},

{m:"Presence, Voice & Delivery",t:"Handling Tough Questions After a Presentation",s:"You've finished presenting and a senior stakeholder challenges the recommendation in front of others.",l:"Stay calm, think clearly, and respond credibly when challenged with a difficult question in public.",tpl:"Toughest question I might get: [X].\nMy calm response: [Y].\nIf I don't know: \"I don't have that number in front of me, I'll follow up by [date].\""},

const PHASE_SECONDS = [4*60, 8*60, 12*60, 4*60, 2*60];
const PHASE_NAMES = ["Retrieval warm-up","Core concept","Applied practice","Compression","Spaced review"];

/* ---------------- STATE (localStorage) ---------------- */
const STORE_KEY = "vantage_state_v1";
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(!parsed.drafts) parsed.drafts = {};
      return parsed;
    }
  }catch(e){}
  return { startDate: null, completedDays: {}, takeaways: {}, drafts: {}, currentDay: 0 };
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
let state = loadState();
if(!state.startDate){ state.startDate = todayStr(); saveState(); }

/* ---------------- SESSION RESUME (persists in-progress phase/timer) ---------------- */
const SESSION_KEY = "vantage_session_v1";
function saveSessionSnapshot(){
  if(!session) return;
  localStorage.setItem(SESSION_KEY, JSON.stringify({
    date: todayStr(), topicIdx: session.topicIdx, phase: session.phase, secondsLeft: session.secondsLeft
  }));
}
function clearSessionSnapshot(){ localStorage.removeItem(SESSION_KEY); }
function loadSessionSnapshot(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const snap = JSON.parse(raw);
    if(snap.date !== todayStr() || doneToday()){ localStorage.removeItem(SESSION_KEY); return null; }
    return snap;
  }catch(e){ return null; }
}

/* ---------------- EXPORT / IMPORT TO DEVICE ---------------- */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "vantage-progress-" + todayStr() + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function triggerImport(){ document.getElementById("importFileInput").click(); }
function handleImportFile(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(typeof parsed !== "object" || !parsed.completedDays){ throw new Error("bad shape"); }
      if(!parsed.drafts) parsed.drafts = {};
      if(!parsed.takeaways) parsed.takeaways = {};
      state = parsed;
      saveState();
      clearSessionSnapshot();
      renderHome();
    }catch(e){
      alert("That file doesn't look like a Vantage backup.");
    }
    evt.target.value = "";
  };
  reader.readAsText(file);
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function daysBetween(a,b){
  const da = new Date(a+"T00:00:00"), db = new Date(b+"T00:00:00");
  return Math.round((db-da)/86400000);
}
function completedCount(){ return Object.keys(state.completedDays).length; }
function currentTopicIndex(){
  // topic index = number of completed sessions so far (capped at TOPICS.length-1)
  return Math.min(completedCount(), TOPICS.length-1);
}
function streak(){
  let s = 0, d = new Date();
  while(true){
    const key = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(state.completedDays[key]){ s++; d.setDate(d.getDate()-1); } else break;
  }
  return s;
}
function doneToday(){ return !!state.completedDays[todayStr()]; }

/* review candidates: topics completed roughly 3, 7, 14 days ago */
function reviewCandidate(){
  const entries = Object.entries(state.completedDays); // [dateStr, topicIndex]
  if(!entries.length) return null;
  const targets = [3,7,14];
  for(const t of targets){
    for(const [dateStr, idx] of entries){
      if(daysBetween(dateStr, todayStr()) === t) return TOPICS[idx];
    }
  }
  return null;
}

/* ---------------- NOTIFICATIONS ---------------- */
function askNotificationPermission(){
  if("Notification" in window && Notification.permission === "default"){
    Notification.requestPermission();
  }
}
function maybeNudge(){
  if(!("Notification" in window)) return;
  if(Notification.permission !== "granted") return;
  if(doneToday()) return;
  if(!navigator.serviceWorker || !navigator.serviceWorker.controller) return;
  navigator.serviceWorker.controller.postMessage({
    type:"SHOW_NUDGE",
    title:"Today's leadership session is waiting",
    body:"Day "+(completedCount()+1)+": "+TOPICS[currentTopicIndex()].t+" — 30 min."
  });
}

/* ---------------- VIEW: HOME ---------------- */
function renderHome(){
  const idx = currentTopicIndex();
  const topic = TOPICS[idx];
  const total = TOPICS.length;
  const done = completedCount();
  const pct = Math.round((done/total)*100);
  const rev = reviewCandidate();
  const finished = done >= total;
  const resumable = loadSessionSnapshot();

  let html = `
  <header>
    <div class="brand">
      <img class="brand-icon" src="icon.svg" alt="Vantage">
      <div class="brand-text">
        <h1>Vantage</h1>
        <div class="tagline">See further. Lead better.</div>
      </div>
    </div>
    <div class="streak">🔥 ${streak()} day streak</div>
  </header>`;

  if(!doneToday() && done > 0){
    html += `<div class="nudge-banner">You haven't done today's session yet. 30 minutes, ${topic.t}.</div>`;
  }

  if(rev && !doneToday()){
    html += `
    <div class="card review-card">
      <div class="rlabel">🔁 QUICK SPACED REVIEW</div>
      <div class="topic-title" style="font-size:16px;margin-bottom:4px;">${rev.t}</div>
      <div class="situation">Before today's new topic — can you still recall the core technique from this one? Try to answer from memory first.</div>
    </div>`;
  }

  if(finished){
    html += `
    <div class="card">
      <div class="module-badge">🎉 Program Complete</div>
      <div class="topic-title" style="font-size:19px;">All 46 sessions done</div>
      <div class="situation">Use buffer days to redo your weakest topics, or revisit your takeaways below.</div>
    </div>`;
  } else {
    html += `
    <div class="card">
      <div class="module-badge">${topic.m}</div>
      <div class="day-label">Day ${done+1} of ${total}</div>
      <div class="topic-title">${topic.t}</div>
      <div class="situation"><b>Situation:</b> ${topic.s}</div>
      <div class="situation" style="margin-top:8px;"><b>You'll learn:</b> ${topic.l}</div>
      ${doneToday()
        ? `<div class="done-check">✓ Session completed today. Nice work.</div>`
        : resumable
          ? `<button class="btn btn-primary" onclick="resumeSession()">Resume Session — Phase ${resumable.phase+1} of 5</button>
             <div class="resume-note">You left off mid-session. Pick up right where you were.</div>`
          : `<button class="btn btn-primary" onclick="startSession()">Start 30-Min Session</button>`}
    </div>`;
  }

  html += `
    <div class="card">
      <div class="progress-wrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="progress-text"><span>${done} / ${total} sessions</span><span>${pct}%</span></div>
      </div>
      <div class="toggle-list" onclick="toggleList()">View full topic list ▾</div>
      <div class="list-topics" id="topicList">
        ${TOPICS.map((tp,i)=>`<div class="topic-row"><div class="tick ${i<done?'on':''}"></div><div>${tp.t}</div></div>`).join("")}
      </div>
    </div>`;

  const tkEntries = Object.entries(state.takeaways);
  if(tkEntries.length){
    html += `<div class="card"><div class="module-badge">Your Takeaways</div><div class="takeaways">`;
    html += tkEntries.slice().reverse().slice(0,8).map(([i,txt])=>`<div class="tk"><b>${TOPICS[i].t}:</b> ${txt}</div>`).join("");
    html += `</div></div>`;
  }

  html += `
    <div class="card">
      <div class="module-badge">Backup</div>
      <div class="situation" style="margin-bottom:2px;">Everything already autosaves on this device. Export a backup file if you're switching phones or reinstalling.</div>
      <div class="data-row" style="margin-top:12px;">
        <button class="btn btn-secondary" onclick="exportData()">⬇️ Save to device</button>
        <button class="btn btn-secondary" onclick="triggerImport()">⬆️ Restore from file</button>
      </div>
    </div>`;

  html += `<div class="footer-note">Ping me (Claude) each day and say "run today's session" — I'll walk you through it live and give feedback on your Phase 3 practice.</div>`;

  document.getElementById("app").innerHTML = html;
  maybeNudge();
}
function toggleList(){ document.getElementById("topicList").classList.toggle("open"); }

/* ---------------- VIEW: SESSION ---------------- */
let session = null; // {phase:0-4, secondsLeft, timerId, topicIdx}

function startSession(){
  session = { phase:0, secondsLeft: PHASE_SECONDS[0], timerId:null, topicIdx: currentTopicIndex() };
  askNotificationPermission();
  saveSessionSnapshot();
  renderSession();
  tick();
}
function resumeSession(){
  const snap = loadSessionSnapshot();
  if(!snap){ startSession(); return; }
  session = { phase: snap.phase, secondsLeft: snap.secondsLeft, timerId:null, topicIdx: snap.topicIdx };
  renderSession();
  tick();
}
function renderSession(){
  const topic = TOPICS[session.topicIdx];
  const rev = reviewCandidate();
  const voiceSupported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  const stepsHtml = PHASE_NAMES.map((n,i)=>{
    let cls = i===session.phase ? "active" : (i<session.phase ? "past" : "");
    return `<div class="step ${cls}"></div>`;
  }).join("");

  let body = "";
  if(session.phase===0){
    body = `Before looking at anything new: what was the topic of your last session, and what's the one technique you're supposed to use from it? Say it out loud or type it below.\n\nThen glance at today's topic:\n\n"${topic.t}"\n\nSituation: ${topic.s}`;
  } else if(session.phase===1){
    body = `${topic.t}\n\nSituation: ${topic.s}\n\nWhat you'll learn: ${topic.l}\n\nOpen a chat with Claude now and paste:\n"Today's topic: ${topic.t}. Walk me through the core concept and give me a framework or script."`;
  } else if(session.phase===2){
    body = `Fill in the brackets below with a real or realistic scenario from your own work. Then tap "Copy for Claude" and paste it into a chat with me — I'll compare it against the technique and give specific feedback.`;
  } else if(session.phase===3){
    body = `Write a one-line takeaway in your own words — the thing you'll actually remember in a meeting three weeks from now.`;
  } else if(session.phase===4){
    body = rev
      ? `Quick spaced review — recall this from memory before you check:\n\n"${rev.t}"\n\nWhat was the core technique?`
      : `No review topic due yet — you'll get one once you have a few sessions under your belt. Nice work today.`;
  }

  const showTakeawayBox = session.phase===3;
  const showTemplateBox = session.phase===2;
  const draftVal = state.drafts[session.topicIdx] !== undefined ? state.drafts[session.topicIdx] : topic.tpl;

  document.getElementById("app").innerHTML = `
    <header>
      <h1>${topic.t}</h1>
    </header>
    <div class="card">
      <div class="steps">${stepsHtml}</div>
      <div class="phase-header">
        <div class="phase-name">Phase ${session.phase+1} · ${PHASE_NAMES[session.phase]}</div>
        <div class="timer" id="timerDisplay">${fmt(session.secondsLeft)}</div>
      </div>
      <div class="phase-body">${body}</div>
      ${showTemplateBox ? `<textarea id="templateInput" style="min-height:160px" oninput="debouncedSaveDraft()">${draftVal}</textarea>
        ${voiceSupported ? `<div class="mic-row"><button class="mic-btn" id="micBtnTemplate" onclick="toggleVoiceInput('templateInput','micBtnTemplate')">🎤 Voice input</button></div>` : ""}
        <button class="btn btn-secondary" onclick="copyTemplate()" id="copyBtn">📋 Copy for Claude</button>` : ""}
      ${showTakeawayBox ? `<textarea id="takeawayInput" placeholder="My takeaway..." oninput="debouncedSaveDraft()">${state.takeaways[session.topicIdx]||""}</textarea>
        ${voiceSupported ? `<div class="mic-row"><button class="mic-btn" id="micBtnTakeaway" onclick="toggleVoiceInput('takeawayInput','micBtnTakeaway')">🎤 Voice input</button></div>` : ""}` : ""}
      <div class="row">
        <button class="btn btn-secondary" style="flex:1" onclick="skipPhase()">Skip / Next phase</button>
        ${session.phase===4 ? `<button class="btn btn-primary" style="flex:1" onclick="finishSession()">Finish Session ✓</button>` : ""}
      </div>
    </div>
    <div class="card">
      <button class="btn btn-secondary" onclick="exitSession()">Exit without finishing</button>
    </div>
  `;
}
function copyTemplate(){
  const ta = document.getElementById("templateInput");
  if(!ta) return;
  const topic = TOPICS[session.topicIdx];
  state.drafts[session.topicIdx] = ta.value;
  saveState();
  const text = `Topic: ${topic.t}\n\nHere's my filled-in template:\n\n${ta.value}\n\nCan you compare this against the technique and give me specific feedback?`;
  const btn = document.getElementById("copyBtn");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      if(btn){ btn.textContent = "✓ Copied — paste into chat with Claude"; setTimeout(()=>{ if(btn) btn.textContent = "📋 Copy for Claude"; }, 2500); }
    }).catch(()=>{ if(btn) btn.textContent = "Couldn't copy — select and copy manually"; });
  }
}

/* ---------------- AUTOSAVE DRAFTS WHILE TYPING ---------------- */
let draftSaveTimer = null;
function debouncedSaveDraft(){
  clearTimeout(draftSaveTimer);
  draftSaveTimer = setTimeout(()=>{
    if(!session) return;
    const tpl = document.getElementById("templateInput");
    const tk = document.getElementById("takeawayInput");
    if(tpl) state.drafts[session.topicIdx] = tpl.value;
    if(tk) state.takeaways[session.topicIdx] = tk.value;
    saveState();
  }, 700);
}

/* ---------------- VOICE INPUT (Web Speech API) ---------------- */
let activeRecognition = null;
let activeRecognitionTargetId = null;
function toggleVoiceInput(targetId, btnId){
  if(activeRecognition && activeRecognitionTargetId === targetId){
    activeRecognition.stop();
    return;
  }
  if(activeRecognition){ activeRecognition.stop(); }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert("Voice input isn't supported in this browser."); return; }
  const ta = document.getElementById(targetId);
  const btn = document.getElementById(btnId);
  if(!ta || !btn) return;
  const baseText = ta.value ? ta.value.replace(/\s+$/,"") : "";
  const rec = new SR();
  rec.lang = "en-US";
  rec.interimResults = true;
  rec.continuous = true;
  activeRecognition = rec;
  activeRecognitionTargetId = targetId;
  btn.classList.add("recording");
  btn.textContent = "⏺ Listening… tap to stop";
  let finalText = "";
  rec.onresult = (e) => {
    let interim = "";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t = e.results[i][0].transcript;
      if(e.results[i].isFinal){ finalText += (finalText ? " " : "") + t.trim(); }
      else{ interim += t; }
    }
    const combined = [baseText, finalText].filter(Boolean).join(" ");
    ta.value = combined + (interim ? " " + interim : "");
  };
  rec.onerror = () => { stopVoiceInput(btn); };
  rec.onend = () => { stopVoiceInput(btn); debouncedSaveDraft(); };
  rec.start();
}
function stopVoiceInput(btn){
  if(activeRecognition){ try{ activeRecognition.stop(); }catch(e){} }
  activeRecognition = null;
  activeRecognitionTargetId = null;
  if(btn){ btn.classList.remove("recording"); btn.textContent = "🎤 Voice input"; }
}
function fmt(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function tick(){
  if(!session) return;
  clearInterval(session.timerId);
  session.timerId = setInterval(()=>{
    if(!session) return;
    session.secondsLeft--;
    const el = document.getElementById("timerDisplay");
    if(el){
      el.textContent = fmt(Math.max(0,session.secondsLeft));
      el.classList.toggle("low", session.secondsLeft<=10 && session.secondsLeft>0);
    }
    if(session.secondsLeft % 5 === 0){ saveSessionSnapshot(); }
    if(session.secondsLeft<=0){
      clearInterval(session.timerId);
      nextPhase();
    }
  },1000);
}
function nextPhase(){
  if(session.phase===2){
    const ta = document.getElementById("templateInput");
    if(ta) state.drafts[session.topicIdx] = ta.value;
    saveState();
  }
  if(session.phase===3){
    const ta = document.getElementById("takeawayInput");
    if(ta) state.takeaways[session.topicIdx] = ta.value.trim();
    saveState();
  }
  if(session.phase < 4){
    session.phase++;
    session.secondsLeft = PHASE_SECONDS[session.phase];
    saveSessionSnapshot();
    renderSession();
    tick();
  } else {
    finishSession();
  }
}
function skipPhase(){
  clearInterval(session.timerId);
  nextPhase();
}
function finishSession(){
  const ta = document.getElementById("takeawayInput");
  if(ta) state.takeaways[session.topicIdx] = ta.value.trim();
  clearInterval(session.timerId);
  state.completedDays[todayStr()] = session.topicIdx;
  saveState();
  clearSessionSnapshot();
  session = null;
  renderHome();
}
function exitSession(){
  saveSessionSnapshot();
  clearInterval(session.timerId);
  session = null;
  renderHome();
}

/* ---------------- INIT ---------------- */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
document.addEventListener("visibilitychange", () => { if(document.hidden){ saveSessionSnapshot(); } });
window.addEventListener("pagehide", saveSessionSnapshot);
renderHome();
</script>
